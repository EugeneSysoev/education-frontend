name: Bootstrap repository

on:
  push:
    paths:
      - .github/workflows/bootstrap.yml
      - .github/workflows/bootstrap.zip

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish prepared learning project
        shell: bash
        run: |
          unzip -o .github/workflows/bootstrap.zip -d .
          rm -f .github/workflows/bootstrap.zip .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add day 1 JavaScript practice and React lab"
          git push

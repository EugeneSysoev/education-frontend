name: Publish learning progress

on:
  push:
    paths:
      - .github/workflows/bootstrap.yml
      - .github/workflows/bootstrap.zip

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish prepared commit
        shell: bash
        run: |
          unzip -o .github/workflows/bootstrap.zip -d .
          rm -f .github/workflows/bootstrap.zip .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add React state and effects practice"
          git push
